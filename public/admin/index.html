<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>لوحة التحكم — سيفتى هوم</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Archivo:wdth,wght@75..100,500..800&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{--cream:#f7f2eb;--cream-2:#efe6da;--paper:#fff;--ink:#23140a;--ink-2:#4a3729;--muted:#6e5b4c;--bronze:#7f5229;--bronze-soft:#c4946a;--line:#e3d7c8;--night:#1b100a;--wa:#1f9d55;--red:#b42318;--focus:#b06a2c;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.55 'IBM Plex Sans Arabic','Archivo',system-ui,sans-serif;min-height:100dvh}
h1,h2,h3{font-family:'Alexandria',system-ui,sans-serif;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.code{font-family:'Archivo',sans-serif;font-stretch:90%;font-weight:700;letter-spacing:.02em}
img{display:block;max-width:100%}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--bronze-soft)}
.btn svg{width:18px;height:18px;flex:none}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.btn-dark:hover{background:#3a2616}
.btn-green{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-green:hover{background:#188547}
.btn-red{color:var(--red);border-color:#f0c9c4}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.icon-btn svg{width:18px;height:18px}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
textarea{min-height:80px;resize:vertical}
label.f{display:grid;gap:6px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
label.f small{font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
a.btn{color:inherit;text-decoration:none}
@media (max-width:560px){.row{grid-template-columns:1fr}}

/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
#login form{width:min(380px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px 28px;display:grid;gap:18px;box-shadow:0 18px 40px rgb(35 20 10/10%)}
#login img{height:96px;margin:0 auto 4px}
#login h1{text-align:center;font-size:22px}
#login .err{color:var(--red);font-size:14px;min-height:20px;text-align:center}

/* app shell */
header.top{position:sticky;top:0;z-index:30;background:rgb(247 242 235/92%);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,28px);max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:'Alexandria';font-weight:700}
.brand img{height:36px}
.bar .sp{flex:1}
.save-state{font-size:13.5px;color:var(--muted)}
.save-state b{color:var(--bronze)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 clamp(12px,3vw,28px) 10px;max-width:1400px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.tab span{font-size:12px;background:var(--cream-2);color:var(--muted);border-radius:999px;padding:1px 8px}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.tab[aria-selected=true] span{background:rgb(255 255 255/14%);color:var(--cream)}
main{max-width:1400px;margin:0 auto;padding:20px clamp(12px,3vw,28px) 120px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar h2{font-size:24px;margin-inline-end:auto}
.toolbar input[type=search]{width:min(260px,100%);min-height:42px;border-radius:999px}
.hint{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px;margin:-6px 0 16px}
.hint svg{width:16px;height:16px;color:var(--bronze);flex:none}

.drop{border:2px dashed var(--bronze-soft);border-radius:18px;background:rgb(255 255 255/60%);padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:background-color .15s,border-color .15s;margin-bottom:18px}
.drop b{color:var(--ink);display:block;font-family:'Alexandria';font-size:15px;margin-bottom:2px}
.drop.over{background:#fff;border-color:var(--bronze)}
.drop svg{width:26px;height:26px;color:var(--bronze);margin:0 auto 6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;transition:box-shadow .2s,transform .2s;user-select:none}
.card:hover{box-shadow:0 10px 28px rgb(35 20 10/12%)}
.card.off{opacity:.55}
.card .ph{aspect-ratio:3/4;background:radial-gradient(120% 80% at 50% 0%,#fbf8f4,var(--cream-2));position:relative;overflow:hidden}
.card .ph img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;pointer-events:none}
.card .ph.cover img{inset:0;width:100%;height:100%;object-fit:cover}
.card .body{padding:9px 11px 11px;display:grid;gap:2px}
.card .t{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .p{font-size:13px;font-weight:600;color:var(--bronze)}
.card .p.none{color:var(--muted);font-weight:400}
.card .tools{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:6px;z-index:2}
.card .tools button{width:34px;height:34px;border-radius:50%;border:0;background:rgb(255 255 255/92%);box-shadow:0 2px 8px rgb(0 0 0/12%);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.card .tools button svg{width:17px;height:17px}
.card .tools button.on{color:#c58a1a}
.card .tools button.eye.on{color:var(--red)}
.card .handle{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;background:rgb(255 255 255/92%);box-shadow:0 2px 8px rgb(0 0 0/12%);display:grid;place-items:center;cursor:grab;z-index:2;color:var(--ink-2);touch-action:none}
.card .handle svg{width:18px;height:18px}
.card .badges{position:absolute;bottom:8px;inset-inline-start:8px;display:flex;gap:4px}
.card .badges span{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--cream)}
.card .badges span.new{background:var(--bronze)}
.card .num{position:absolute;bottom:8px;inset-inline-end:8px;font-size:11px;background:rgb(255 255 255/90%);border-radius:999px;padding:1px 7px;color:var(--muted)}
.sortable-ghost{opacity:.3}
.sortable-chosen .card,.sortable-chosen{box-shadow:0 18px 40px rgb(35 20 10/22%)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:18px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(27 16 10/40%);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--cream);z-index:41;display:grid;grid-template-rows:auto 1fr auto;box-shadow:-20px 0 50px rgb(0 0 0/18%);animation:slide .25s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.drawer header h3{flex:1;font-size:18px}
.drawer .content{overflow:auto;padding:18px;display:grid;gap:18px;align-content:start}
.drawer footer{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.drawer footer .sp{flex:1}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.sec h4{margin:0;font-family:'Alexandria';font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h4 small{font-family:'IBM Plex Sans Arabic';font-weight:400;color:var(--muted);font-size:12.5px}
.vars{display:grid;gap:10px}
.var{display:grid;grid-template-columns:auto 76px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fdfbf8}
.var .h{cursor:grab;color:var(--muted);touch-action:none}
.var .h svg{width:18px;height:18px}
.var .im{width:76px;height:96px;border-radius:8px;background:var(--cream-2);overflow:hidden;position:relative;cursor:pointer}
.var .im img{width:100%;height:100%;object-fit:contain}
.var .im::after{content:'غيّر';position:absolute;inset:auto 0 0;font-size:11px;text-align:center;background:rgb(0 0 0/45%);color:#fff;padding:2px;opacity:0;transition:opacity .15s}
.var .im:hover::after{opacity:1}
.var .fields{display:grid;gap:6px}
.var .fields input,.var .fields select{min-height:38px;padding:6px 10px;font-size:14px}
.var .sw{display:flex;align-items:center;gap:8px}
.var .sw i{width:26px;height:26px;border-radius:50%;background-size:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.gal{display:flex;flex-wrap:wrap;gap:8px}
.gal .g{position:relative;width:76px;height:96px;border-radius:8px;overflow:hidden;background:var(--cream-2)}
.gal .g img{width:100%;height:100%;object-fit:cover}
.gal .g button{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgb(0 0 0/55%);color:#fff;display:grid;place-items:center;cursor:pointer}
.gal .g button svg{width:14px;height:14px}
.mini-drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer}
.mini-drop.over{border-color:var(--bronze);background:#fff}
table.sizes{width:100%;border-collapse:collapse}
table.sizes th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:start;padding:0 4px 6px}
table.sizes td{padding:3px}
table.sizes input{min-height:38px;padding:6px 8px;font-size:14px;direction:ltr;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch input{appearance:none;width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background-color .15s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/20%);transition:inset-inline-start .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{inset-inline-start:23px}
.switch small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}

/* save bar + toast */
.savebar{position:fixed;inset-inline:0;bottom:0;z-index:35;display:flex;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.savebar .in{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--night);color:var(--cream);padding:10px 10px 10px 18px;border-radius:999px;box-shadow:0 18px 40px rgb(0 0 0/28%);animation:up .25s cubic-bezier(.22,1,.36,1)}
html[dir=rtl] .savebar .in{padding:10px 18px 10px 10px}
.savebar .in span{font-size:14px}
.savebar .btn-ghost{background:transparent;color:var(--cream);border-color:rgb(255 255 255/22%)}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgb(0 0 0/25%);font-size:14.5px;max-width:min(92vw,520px);text-align:center}
.toast.err{background:var(--red)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgb(255 255 255/35%);border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:12px}
.loading .spin{border-color:var(--line);border-top-color:var(--bronze);width:28px;height:28px}
@media (max-width:640px){.bar .save-state,.bar .open-site span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form id="loginForm" autocomplete="on">
    <img src="/brand/logo.png" alt="سيفتى هوم" />
    <h1>لوحة التحكم</h1>
    <label class="f">الباسورد
      <input type="password" id="pw" name="password" autocomplete="current-password" required />
    </label>
    <button class="btn btn-dark" type="submit" id="loginBtn">ادخل</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="bar">
      <div class="brand"><img src="/brand/mark.png" alt="" />لوحة التحكم</div>
      <div class="sp"></div>
      <span class="save-state" id="pubState"></span>
      <a class="btn open-site" href="/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span>افتح الموقع</span></a>
      <button class="icon-btn" id="logout" title="خروج" aria-label="خروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="الأقسام"></nav>
  </header>
  <main id="main"><div class="loading"><div class="spin"></div>بنحمّل المنتجات…</div></main>
</div>

<div class="savebar hidden" id="savebar"><div class="in">
  <span id="dirtyText"></span>
  <button class="btn btn-ghost" id="discard">إلغاء</button>
  <button class="btn btn-green" id="saveBtn">احفظ وانشر</button>
</div></div>

<input type="file" id="filePick" accept="image/*" multiple class="hidden" />

<script>
const CATS = [
  { slug: 'armored', ar: 'أبواب مصفحة تركي', photo: true, defLine: 'تصفيح تركي بالكامل', title: (m) => `باب مصفح تركي كود ${m}`, titleEn: (m) => `Turkish armored door code ${m}` },
  { slug: 'room', ar: 'أبواب غرف تركي', title: (m) => `باب غرفة تركي كود ${m}`, titleEn: (m) => `Turkish room door code ${m}` },
  { slug: 'wpc', ar: 'أبواب WPC', wpc: true, title: (m) => `باب WPC ${m}`, titleEn: (m) => `WPC door ${m}` },
  { slug: 'kitchens', ar: 'مطابخ', photo: true, title: (m) => `مطبخ موديل ${m}`, titleEn: (m) => `Kitchen model ${m}` },
  { slug: 'dressing', ar: 'دريسنج روم', photo: true, title: (m) => `دريسنج روم موديل ${m}`, titleEn: (m) => `Dressing room model ${m}` },
  { slug: 'floors', ar: 'أرضيات', photo: true, floor: true, title: (m) => `أرضية ${m}`, titleEn: (m) => `${m} flooring` },
  { slug: 'wood', ar: 'أبواب خشب', photo: true, title: (m) => `باب خشب كود ${m}`, titleEn: (m) => `Wooden door code ${m}` },
  { slug: 'pvc', ar: 'شبابيك PVC', photo: true, title: (m) => `شباك PVC كود ${m}`, titleEn: (m) => `PVC window code ${m}` },
];
const WPC_COLORS = { C182:'ماهوجني', C102:'جوز غامق', C205:'بلوط عسلي', C132:'جوز فاتح', C173:'بلوط رمادي', C160:'بيج', C198:'كريمي', C115:'رمادي فاتح', C091:'رمادي غامق', C021:'موكا', C8001:'أبيض', C155:'سيلفر' };
const SITE_FIELDS = [
  ['بيانات التواصل', [['whatsapp','رقم الواتساب','بالصيغة الدولية من غير + — مثلا 201103382322'],['phone','رقم التليفون',''],['facebook','لينك فيسبوك',''],['instagram','لينك إنستجرام',''],['tiktok','لينك تيك توك','']]],
  ['المعرض', [['addressAr','العنوان بالعربي',''],['addressEn','العنوان بالإنجليزي',''],['hoursAr','المواعيد بالعربي','مثلا: كل يوم من 10 الصبح لـ 10 بالليل'],['hoursEn','المواعيد بالإنجليزي',''],['mapsUrl','لينك جوجل ماب',''],['mapEmbedQuery','مكان الخريطة','إحداثيات أو اسم المكان']]],
  ['الرئيسية', [['heroTitleAr','العنوان الكبير بالعربي',''],['heroTitleEn','العنوان الكبير بالإنجليزي',''],['heroTextAr','النص بالعربي','',true],['heroTextEn','النص بالإنجليزي','',true],['heroYoutubeId','كود فيديو يوتيوب','الجزء اللي بعد youtu.be/']]],
  ['الإعلانات', [['metaPixelId','Meta Pixel ID','من Events Manager — أرقام بس']]],
];
const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2"/><path d="M6.6 6.6A16.6 16.6 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',

/* ---------------- state ---------------- */
let S = null;               // { head, products, site }
let tab = 'armored';
let query = '';
const dirty = { products: new Set(), del: new Set(), files: new Map(), delFiles: new Set(), site: false };
const previews = new Map(); // site url -> object URL for freshly uploaded images
let lastPublished = null;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catOf = (slug) => CATS.find((c) => c.slug === slug);
const bySlug = (slug) => S.products.find((p) => p.slug === slug);

const fallback = (img) => { const u = img.dataset.u; if (!u || img.dataset.f) return; img.dataset.f = 1; img.src = '/admin/api/file?path=' + encodeURIComponent('public' + u); };
window.fallback = fallback;

function toast(msg, isErr) {
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 6000 : 3500);
}
async function api(path, opts = {}) {
  const r = await fetch('/admin/api/' + path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'sh-admin', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== 'login') { showLogin(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(j.error || 'حصلت مشكلة');
  return j;
}

/* ---------------- login ---------------- */
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#pw').focus(); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = $('#loginBtn'); b.disabled = true; $('#loginErr').textContent = '';
  try { await api('login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) }); $('#login').classList.add('hidden'); boot(); }
  catch (er) { $('#loginErr').textContent = er.message === 'unauthorized' ? 'الباسورد غلط' : er.message; }
  b.disabled = false;
});
$('#logout').addEventListener('click', async () => { if (dirtyCount() && !confirm('فيه تعديلات مش محفوظة. تخرج برضه؟')) return; await fetch('/admin/api/logout'); location.reload(); });

async function boot() {
  $('#app').classList.remove('hidden');
  try {
    S = await api('state');
    S.products.forEach(normalize);
    renderTabs(); render();
  } catch (e) {
    if (e.message !== 'unauthorized') $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
function normalize(p) {
  p.variants ||= []; p.sizes ||= []; p.gallery ||= [];
  p.order ??= 100;
}

/* ---------------- tabs ---------------- */
function renderTabs() {
  const counts = Object.fromEntries(CATS.map((c) => [c.slug, S.products.filter((p) => p.category === c.slug).length]));
  $('#tabs').innerHTML = CATS.map((c) => `<button class="tab" role="tab" aria-selected="${tab === c.slug}" data-t="${c.slug}">${esc(c.ar)}<span>${counts[c.slug]}</span></button>`).join('')

}

/* ---------------- category view ---------------- */

    ${shown.length ? `<div class="grid" id="grid">${shown.map((p, i) => cardHTML(p, i, c)).join('')}</div>` : `<div class="empty">${query ? 'مفيش نتايج' : 'لسه مفيش منتجات في القسم ده — اسحب صور فوق عشان تبدأ'}</div>`}
  `;

function cardHTML(p, i, c) {

    <div class="ph ${c.photo ? 'cover' : ''}">${u ? `<img src="${esc(imgSrc(u))}" data-u="${esc(u)}" onerror="fallback(this)" alt="" loading="lazy" />` : ''}
      <div class="tools">
        <button class="star ${p.featured ? 'on' : ''}" title="يظهر في الرئيسية" aria-label="يظهر في الرئيسية" aria-pressed="${!!p.featured}">${p.featured ? ICON.star : ICON.starO}</button>
        <button class="eye ${p.hidden ? 'on' : ''}" title="${p.hidden ? 'مخفي — دوس عشان يظهر' : 'إخفاء من الموقع'}" aria-label="إخفاء" aria-pressed="${!!p.hidden}">${p.hidden ? ICON.eyeOff : ICON.eye}</button>

/* ---------------- products ---------------- */
function slugify(s) { return String(s).toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, ''); }
function uniqueSlug(base) { let s = base, n = 2; while (S.products.some((p) => p.slug === s)) s = `${base}-${n++}`; return s; }
function newProduct(cat, model) {
  const c = catOf(cat);
  const max = Math.max(0, ...S.products.filter((p) => p.category === cat).map((p) => p.order || 0));
  return {
    slug: '', _new: true, title: model ? c.title(model) : '', titleEn: model ? c.titleEn(model) : '', category: cat, model,
    line: c.defLine || '', lineEn: c.defLine ? 'Fully Turkish armored' : '',
    variants: [], gallery: [], sizes: c.wpc ? [80, 90, 100, 110].map((w) => ({ width: w, height: 215, price: null, oldPrice: null })) : [],
    price: null, oldPrice: null, customSizes: !c.floor, featured: false, hidden: false, order: max + 1, note: '', noteEn: '',
  };
}
function mark(p) { dirty.products.add(p.slug); updateSavebar(); }
function dirtyCount() { return dirty.products.size + dirty.del.size + (dirty.site ? 1 : 0); }
function updateSavebar() {
  const n = dirtyCount();
  $('#savebar').classList.toggle('hidden', !n);
  $('#dirtyText').textContent = n === 1 ? 'تعديل واحد مش محفوظ' : `${n} تعديلات مش محفوظة`;
}
addEventListener('beforeunload', (e) => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------------- images ---------------- */
function readImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('الملف ده مش صورة: ' + file.name)); img.src = URL.createObjectURL(file); });
}
function toWebp(img, maxW, maxH, q = 0.82) {
  const s = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b), 'image/webp', q));
}
const blobB64 = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(b); });
/** Process an image file into full + small webp, stage both for commit, return the site URL */
async function addImage(slug, file) {
  const img = await readImage(file);
  const key = 'img-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const full = await toWebp(img, 1400, 1400), sm = await toWebp(img, 900, 620, 0.78);
  const url = `/products/${slug}/${key}.webp`;
  dirty.files.set(`public${url}`, await blobB64(full));
  dirty.files.set(`public${small(url)}`, await blobB64(sm));
  previews.set(url, URL.createObjectURL(full)); previews.set(small(url), URL.createObjectURL(sm));
  return url;
}
function dropImage(url) {
  if (!url || !url.startsWith('/products/')) return;
  for (const u of [url, small(url)]) { const path = 'public' + u; if (dirty.files.has(path)) dirty.files.delete(path); else dirty.delFiles.add(path); }
}
function bindDrop(el, onFiles) {
  const pick = () => { const f = $('#filePick'); f.value = ''; f.onchange = () => onFiles([...f.files]); f.click(); };
  el.addEventListener('click', pick);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('over'); const fs = [...e.dataTransfer.files].filter((f) => f.type.startsWith('image/')); if (fs.length) onFiles(fs); });
}
async function bulkAdd(files) {
  const d = $('#bulkDrop'); if (d) d.innerHTML = `<div class="spin" style="margin:0 auto;border-color:var(--line);border-top-color:var(--bronze)"></div>بنجهّز ${files.length} صورة…`;
  let n = 0;
  for (const f of files) {
    try {
      const model = f.name.replace(/\.[^.]+$/, '').replace(/^(كود|code)\s*/i, '').trim();
      const p = newProduct(tab, model);
      p.slug = uniqueSlug(`${tab}-${slugify(model) || Date.now().toString(36)}`);
      p.variants.push({ color: '', image: await addImage(p.slug, f) });
      S.products.push(p); mark(p); n++;
    } catch (e) { toast(e.message, true); }
  }
  renderTabs(); render(); if (n) toast(`اتضاف ${n} منتج — راجعهم واحفظ`);
}

/* ---------------- editor ---------------- */

    if (!confirm(`تمسح ${draft.model} نهائي من الموقع؟`)) return;
    const slug = draft.slug; const orig = bySlug(slug);
    S.products = S.products.filter((p) => p.slug !== slug);
    dirty.products.delete(slug);
    if (orig && orig._new) [...dirty.files.keys()].filter((k) => k.startsWith(`public/products/${slug}/`)).forEach((k) => dirty.files.delete(k));
    else dirty.del.add(slug);
    closeEditor(); renderTabs(); render(); updateSavebar();
  });
  $('#apply').onclick = () => {
    if (!draft.model.trim()) { toast('اكتب الكود الأول', true); $('#e-model').focus(); return; }
    if (!draft.variants.length) { toast('ضيف صورة واحدة على الأقل', true); return; }
    ensureSlug();
    const i = S.products.findIndex((p) => p.slug === draft.slug);
    if (i >= 0) S.products[i] = draft; else S.products.push(draft);
    mark(draft); closeEditor(); renderTabs(); render();
  };
}
function ensureSlug() { if (!draft.slug) draft.slug = uniqueSlug(`${draft.category}-${slugify(draft.model) || Date.now().toString(36)}`); }
function varHTML(x, i, c) {
  const u = small(x.image);
  const colorField = c.wpc
    ? `<div class="sw"><i style="background-image:url(/swatches/${esc(x.color)}.webp)"></i><select data-k="color" aria-label="كود اللون"><option value="">— اللون —</option>${Object.entries(WPC_COLORS).map(([k, n]) => `<option value="${k}" ${x.color === k ? 'selected' : ''}>${k} · ${n}</option>`).join('')}</select></div>`
    : `<input type="text" data-k="colorName" placeholder="اسم اللون (اختياري) — مثلا جراي" value="${esc(x.colorName || '')}" aria-label="اسم اللون" />`;
  return `<div class="var" data-vi="${i}">
    <span class="h" title="اسحب عشان ترتّب">${ICON.grip}</span>
    <div class="im" title="دوس عشان تغيّر الصورة"><img src="${esc(imgSrc(u))}" data-u="${esc(u)}" onerror="fallback(this)" alt="" /></div>
    <div class="fields">${colorField}${!c.wpc ? `<input type="text" data-k="colorNameEn" placeholder="اسم اللون بالإنجليزي" value="${esc(x.colorNameEn || '')}" dir="ltr" aria-label="اسم اللون بالإنجليزي" />` : ''}<small style="color:var(--muted);font-size:12px">${i === 0 ? 'الصورة الأساسية' : 'صورة ' + (i + 1)}</small></div>
    <button class="icon-btn" data-vdel="${i}" aria-label="شيل الصورة">${ICON.trash}</button>
  </div>`;
}

/* ---------------- settings ---------------- */
function renderSettings() {
  const s = S.site;
  $('#main').innerHTML = `<div class="toolbar"><h2>بيانات الموقع</h2></div><div style="display:grid;gap:16px;max-width:760px">${SITE_FIELDS.map(([h, fs]) => `
    <div class="sec"><h4>${h}</h4>${fs.map(([k, l, hint, area]) => `<label class="f">${l}${hint ? ` <small>${hint}</small>` : ''}${area ? `<textarea data-s="${k}">${esc(s[k] || '')}</textarea>` : `<input type="text" data-s="${k}" value="${esc(s[k] || '')}" ${/En$|Url|Id|whatsapp|phone|facebook|instagram|tiktok|Query/.test(k) ? 'dir="ltr"' : ''} />`}</label>`).join('')}</div>`).join('')}</div>`;
  $('#main').querySelectorAll('[data-s]').forEach((el) => el.addEventListener('input', () => { S.site[el.dataset.s] = el.value.trim(); dirty.site = true; updateSavebar(); }));
}

/* ---------------- save ---------------- */
$('#discard').onclick = () => { if (!confirm('تلغي كل التعديلات اللي مش محفوظة؟')) return; location.reload(); };
$('#saveBtn').onclick = async () => {
  const b = $('#saveBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>بيتحفظ…';
  try {
    const products = [...dirty.products].filter((s) => !dirty.del.has(s)).map((s) => bySlug(s)).filter(Boolean).map((p) => {
      const { slug, _new, _saved, ...data } = p; return { slug, data };
    });
    // only keep staged files that are still referenced
    const used = new Set(S.products.flatMap((p) => [...p.variants.map((v) => v.image), ...p.gallery]).flatMap((u) => ['public' + u, 'public' + small(u)]));
    const files = [...dirty.files].filter(([path]) => used.has(path)).map(([path, base64]) => ({ path, base64 }));
    const n = products.length + dirty.del.size;
    const message = [n ? `${n} product${n > 1 ? 's' : ''}` : '', dirty.site ? 'site settings' : ''].filter(Boolean).join(', ');
    const r = await api('commit', { method: 'POST', body: JSON.stringify({
      head: S.head, message: 'Update ' + message, products, files,
      deleteProducts: [...dirty.del], deleteFiles: [...dirty.delFiles].filter((p) => !used.has(p)), site: dirty.site ? S.site : undefined,
    }) });
    if (r.head) S.head = r.head;
    S.products.forEach((p) => { p._new = false; p._saved = true; });
    dirty.products.clear(); dirty.del.clear(); dirty.files.clear(); dirty.delFiles.clear(); dirty.site = false;
    lastPublished = Date.now(); updateSavebar(); render(); tickPublish();
    toast('اتحفظ ✓ — هيظهر على الموقع خلال دقيقتين تقريبًا');
  } catch (e) {
    if (/expected|head|stale|oid/i.test(e.message)) toast('فيه تعديل اتعمل من مكان تاني. اعمل Refresh للصفحة وجرّب تاني.', true);
    else if (e.message !== 'unauthorized') toast('ماتحفظش: ' + e.message, true);
  }
  b.disabled = false; b.textContent = 'احفظ وانشر';
};
function tickPublish() {
  const el = $('#pubState'); if (!lastPublished) return (el.textContent = '');
  const s = Math.round((Date.now() - lastPublished) / 1000);
  if (s > 180) { el.innerHTML = '<b>✓</b> التعديلات على الموقع'; return; }
  el.innerHTML = `<b>●</b> الموقع بيتحدّث… (${Math.max(0, 120 - s)} ث)`;
  setTimeout(tickPublish, 1000);
}

/* ---------------- start ---------------- */
fetch('/admin/api/state', { credentials: 'same-origin' }).then((r) => { if (r.status === 401) showLogin(); else boot(); }).catch(() => showLogin());
</script>
</body>
</html>
